[project]
name = "edupredict"
version = "1.0.0"
description = "EduPredict - Machine Learning Student Performance Analytics"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Flask>=2.2.0",
    "Flask-CORS>=3.0.0",
    "Flask-SQLAlchemy>=3.0.0",
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "scikit-learn>=1.2.0",
    "joblib>=1.2.0",
    "Werkzeug>=2.2.0"
]

[tool.vercel]
entrypoint = "backend.app:app"
